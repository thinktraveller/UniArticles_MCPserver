[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniarticles-mcp"
version = "3.5.0"
description = "Unified MCP server for multi-source academic literature retrieval"
readme = "README.md"
# v3.4.0: 双许可（开源侧 AGPL-3.0-or-later + 可另行获取的商业授权）。
# 单个 SPDX 标识无法表达“商业受限”，故元数据只写开源侧标识；双许可的完整说明
# 在 README.md / README_EN.md 的协议章节。此标识必须与 LICENSE 正文保持一致。
license = "AGPL-3.0-or-later"
authors = [
    { name = "thinktraveller", email = "wangzh685@mail2.sysu.edu.cn" }
]
keywords = ["mcp", "academic", "research", "scopus", "arxiv", "pubmed", "scholar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.1.0",
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/thinktraveller"
Repository = "https://github.com/thinktraveller/UniArticles_MCPserver"
Issues = "https://github.com/thinktraveller/UniArticles_MCPserver/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
uniarticles-mcp = "uniarticles.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uniarticles"]

[tool.hatch.build.targets.sdist]
# 排除内部研发文档/配置，不对外分发（wheel 已由上面的 packages 限定范围，无需排除）。
# 采用 gitignore 风格的锚定 glob，前导 "/" 表示相对仓库根目录。
exclude = [
    "/project-docs",   # 内部规划文档：goal.md / project-plan.md / buildlog.md
    "/.claude",        # Claude Code 本地配置（含 settings.local.json）
    "/CLAUDE.md",      # 给 Claude Code 的开发指导文件
    "/docs",           # Elsevier 官方文档等内部调研资料（本已被 .gitignore 排除，此处双保险）
    "/.env",           # 真实凭据文件（本已被 .gitignore 排除，此处双保险，关键安全项）
]
